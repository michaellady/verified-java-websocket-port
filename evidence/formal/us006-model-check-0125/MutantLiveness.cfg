\* TLC configuration for connection-model.tla (staged as ConnectionModel.cfg
\* next to ConnectionModel.tla; see the STAGE AS note in the module header).
\* Bounds are deliberately small and finite: MaxSends exceeds QueueCapacity
\* so the bounded-queue invariant is falsifiable by removing the enqueue
\* guard. Deadlock detection stays at the TLC default (enabled); the Done
\* action makes the terminal state stutter instead of deadlocking.
SPECIFICATION Spec
CONSTANT
    QueueCapacity = 2
    MaxSends = 3
    MaxInbound = 3
INVARIANT TypeInvariant
INVARIANT TerminalDeliveredAtMostOnce
INVARIANT ClosedImpliesTerminalDeliveredOnce
INVARIANT CloseDetailPresentFromClosing
INVARIANT ErrorCloseCodeDomain
INVARIANT InboundCloseNormalization
INVARIANT QueueNeverExceedsCapacity
INVARIANT TruncatedTailStaging
PROPERTY TerminalAbsorbing
PROPERTY ClosingLeadsToClosed
