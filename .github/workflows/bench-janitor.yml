name: Bench Workspace Janitor

# Sweep for orphaned bench-pr-* workspaces — benchmark jobs whose same-job
# `terraform destroy` never completed (runner killed, AWS outage, destroy
# failed all retries). benchmark.yml handles the happy path with its
# always() teardown; this catches the leftovers, which otherwise linger as
# a BILLING bare-metal instance plus VPC/SG/role/state.
#
# Modeled on DIALED's pr-janitor.yml with two deliberate differences:
#   1. Threshold is 3 HOURS, not PR-closed: bench workspaces are job-scoped
#      (the job's hard timeout is 2h), so ANY bench-pr-* state older than 3h
#      is an orphan regardless of whether its PR is still open.
#   2. Schedule is every 3 hours, because the orphan is a metal instance
#      billing by the hour, not idle Lambdas.
#
# The job MUST be gated behind the `dev` GitHub Environment: the narrowed
# dev deploy-role OIDC trust admits only `pull_request` and
# `environment:dev` subjects, and a schedule/workflow_dispatch run would
# otherwise present a `ref:refs/heads/...` subject the trust rejects.
#
# Safety: only touches workspaces named bench-pr-<N> whose state object
# hasn't changed in 3+ hours, so it never races an in-flight benchmark job;
# DynamoDB state locking backstops any remaining race.

on:
  schedule:
    - cron: "41 */3 * * *" # every 3 hours
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: bench-janitor-dev
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep orphaned bench workspaces
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/dialed-setup
        with:
          env: dev

      - name: Terraform init (benchmark)
        working-directory: terraform/benchmark
        run: |
          terraform init \
            -backend-config="bucket=dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tfstate" \
            -backend-config="key=benchmark/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tflocks" \
            -backend-config="encrypt=true"

      - name: Find orphaned bench workspaces
        id: find
        # Selection logic (key filter, 3-hour age threshold, fail-loud
        # listing) lives in cmd/benchjanitor; this step is a thin
        # invocation. The helper writes orphans=<numbers> to GITHUB_OUTPUT.
        run: go run ./cmd/benchjanitor find --bucket "dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tfstate" --max-age-hours 3

      - name: Copy auto-tfvars into benchmark dir
        if: steps.find.outputs.orphans != ''
        run: cp .dialed-cache/dialed.auto.tfvars.json terraform/benchmark/dialed.auto.tfvars.json

      - name: Destroy orphaned workspaces
        if: steps.find.outputs.orphans != ''
        # The retrying destroy loop (2 attempts, 60s backoff, one bad
        # workspace never aborts the batch, step summary + nonzero exit on
        # any failure) lives in cmd/benchjanitor; this step is a thin
        # invocation.
        run: go run ./cmd/benchjanitor destroy --chdir terraform/benchmark --numbers "${{ steps.find.outputs.orphans }}"
