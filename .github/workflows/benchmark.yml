name: Benchmark Confirmation Host (US-008 pipeline)

# JOB-SCOPED lifecycle (feasibility-study "shape A"): this single job
# provisions the bare-metal confirmation host, runs the benchmark runner
# natively via SSM, syncs results, and DESTROYS the host in the SAME job
# under `if: always()` — never PR-open→PR-close billing. Orphans (runner
# died, AWS outage) are swept by bench-janitor.yml after 3 hours.
#
# COST NOTE: the default-candidate instance type is c5n.metal, whose
# us-east-1 on-demand rate is on the order of ~$4/hour (verify current AWS
# pricing before enabling the pipeline). Job-scoped billing bounds each run
# to roughly 1-2 instance-hours; a PR-open→PR-close lifecycle on a 7-day PR
# would bill ~168 hours — the ~140x cost rationale for shape A. The hard
# `timeout-minutes` below is the belt-and-braces bound; the janitor is the
# backstop behind that.
#
# HONESTY CONTRACT: this workflow is ENABLING WORK for US-008, not US-008
# itself. The runner it invokes is a STUB that validates arguments and emits
# a result-schema skeleton whose every metric field is the NOT_MEASURED
# sentinel. Nothing this workflow produces is a benchmark sample, a
# performance claim, or evidence that US-008 passes. Measured runs are
# additionally fail-closed: the Terraform root refuses to provision a host
# without a preregistration-pinned AMI unless allow_unpinned_ami=true is
# passed explicitly for a plumbing test.
#
# PREREQUISITES (owner-gated, NOT yet done — workflow fails closed until
# then; see docs/us008-benchmark-pipeline.md):
#   - DIALED bootstrap apply in the EVC dev account under project vjwp-bench
#     (OIDC trust, deploy role, permissions boundary, tfstate bucket+locks)
#   - GitHub `dev` environment on this repo
#   - vCPU quota for metal instance in us-east-1

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run the benchmark pipeline for (names the bench-pr-<N> workspace)"
        required: true
        type: string
      instance_type:
        description: "Override bare-metal instance type (default: terraform var default, c5n.metal — OWNER-DECISION-PENDING)"
        required: false
        type: string
      ami_id:
        description: "Preregistration-pinned AMI id (required for any measured run; probe the real account first)"
        required: false
        type: string
      allow_unpinned_ami:
        description: "PLUMBING TEST ONLY: provision with latest AL2023 AMI; output can never be a measurement"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: bench-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false # never cancel mid-run: teardown must always complete

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  benchmark-host:
    name: Provision, run, destroy (job-scoped)
    # Only the 'benchmark' label triggers the PR path; other labels no-op.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 120 # hard lifetime bound for the metal host (mirrors terraform var max_run_minutes)
    steps:
      - uses: actions/checkout@v4

      - name: DIALED setup
        uses: ./.github/actions/dialed-setup
        with:
          env: dev

      - name: Derive bench workspace
        run: |
          # Job-scoped workspace naming contract: bench-pr-<N>. Deliberately
          # NOT the dialed-setup env-pr-<N> derivation — bench workspaces are
          # created and deleted inside this one job.
          echo "BENCH_WORKSPACE=bench-pr-${PR_NUMBER}" >> "$GITHUB_ENV"

      - name: Terraform init (benchmark)
        id: init
        working-directory: terraform/benchmark
        run: |
          terraform init \
            -backend-config="bucket=dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tfstate" \
            -backend-config="key=benchmark/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tflocks" \
            -backend-config="encrypt=true"

      - name: Select or create bench workspace
        id: workspace
        working-directory: terraform/benchmark
        run: terraform workspace select -or-create "${BENCH_WORKSPACE}"

      - name: Copy auto-tfvars into benchmark dir
        run: cp .dialed-cache/dialed.auto.tfvars.json terraform/benchmark/dialed.auto.tfvars.json

      - name: Terraform apply (provision host)
        working-directory: terraform/benchmark
        env:
          INPUT_INSTANCE_TYPE: ${{ inputs.instance_type }}
          INPUT_AMI_ID: ${{ inputs.ami_id }}
          INPUT_ALLOW_UNPINNED: ${{ inputs.allow_unpinned_ami }}
        run: |
          set -euo pipefail
          extra_args=()
          if [ -n "${INPUT_INSTANCE_TYPE}" ]; then
            extra_args+=(-var "instance_type=${INPUT_INSTANCE_TYPE}")
          fi
          if [ -n "${INPUT_AMI_ID}" ]; then
            extra_args+=(-var "ami_id=${INPUT_AMI_ID}")
          fi
          if [ "${INPUT_ALLOW_UNPINNED}" = "true" ]; then
            extra_args+=(-var "allow_unpinned_ami=true")
          fi
          # With no pinned AMI and no explicit plumbing-test flag, apply
          # FAILS CLOSED on the instance precondition — that is the intended
          # preregistration gate, and the always() destroy below still runs.
          terraform apply -auto-approve -input=false \
            -var "pr_number=${PR_NUMBER}" \
            "${extra_args[@]}"

      - name: Capture stack outputs
        id: stack
        working-directory: terraform/benchmark
        run: |
          set -euo pipefail
          instance_id=$(terraform output -raw instance_id)
          bucket=$(terraform output -raw bucket)
          {
            echo "instance_id=${instance_id}"
            echo "bucket=${bucket}"
          } >> "$GITHUB_OUTPUT"
          echo "Host: ${instance_id}  Results bucket: ${bucket}"

      - name: Wait for SSM Online
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
        run: |
          set -euo pipefail
          # Metal hosts can take 10-20 minutes to boot; allow up to 30.
          ping="None"
          for _ in $(seq 1 120); do
            ping=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "None")
            if [ "$ping" = "Online" ]; then
              echo "SSM agent Online on ${INSTANCE_ID}"
              break
            fi
            echo "PingStatus=${ping}; waiting..."
            sleep 15
          done
          if [ "$ping" != "Online" ]; then
            echo "::error::SSM agent never came Online on ${INSTANCE_ID} — failing (teardown still runs)."
            exit 1
          fi

      - name: Stage benchmark runner in results bucket
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: aws s3 cp benchmarks/runner/run-benchmark.sh "s3://${BUCKET}/runner/run-benchmark.sh"

      - name: Run benchmark runner natively via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          set -euo pipefail
          # The runner is a STUB (see benchmarks/runner/run-benchmark.sh): it
          # validates its arguments and emits the result-schema skeleton with
          # NOT_MEASURED sentinels. It fabricates no benchmark numbers.
          params=$(jq -n --arg b "$BUCKET" --arg pr "$PR_NUMBER" --arg ws "$BENCH_WORKSPACE" '{
            executionTimeout: ["5400"],
            commands: [
              "set -euo pipefail",
              "mkdir -p /opt/vjwp-bench/results",
              "aws s3 cp s3://\($b)/runner/run-benchmark.sh /opt/vjwp-bench/run-benchmark.sh",
              "chmod +x /opt/vjwp-bench/run-benchmark.sh",
              "/opt/vjwp-bench/run-benchmark.sh --mode pipeline-smoke --pr \($pr) --workspace \($ws) --out /opt/vjwp-bench/results",
              "aws s3 sync /opt/vjwp-bench/results s3://\($b)/results/"
            ]
          }')
          cmd_id=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${INSTANCE_ID}" \
            --comment "US-008 pipeline smoke (stub runner, NOT_MEASURED output only)" \
            --parameters "$params" \
            --query 'Command.CommandId' --output text)
          echo "command_id=${cmd_id}" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command ${cmd_id}"

      - name: Poll SSM command to completion
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail
          status="Pending"
          for _ in $(seq 1 360); do
            status=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$status" in
              Success)
                echo "SSM command succeeded."
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM command ended with status ${status}"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
              *)
                echo "Status=${status}; waiting..."
                sleep 10
                ;;
            esac
          done
          if [ "$status" != "Success" ]; then
            echo "::error::SSM command did not complete before the polling limit."
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
            --query 'StandardOutputContent' --output text

      - name: Sync results out of S3
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          set -euo pipefail
          mkdir -p bench-results
          aws s3 sync "s3://${BUCKET}/results/" bench-results/
          echo "Fetched result files:"
          find bench-results -type f

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-pr-${{ env.PR_NUMBER }}-results
          path: bench-results/
          if-no-files-found: error
          retention-days: 30

      # ─── Teardown: ALWAYS, same job ─────────────────────────────────────
      # Runs even when apply / SSM / sync failed. Only skipped when init or
      # workspace selection itself failed (nothing was created in that case).

      - name: Terraform destroy (always)
        if: always() && steps.workspace.outcome == 'success'
        working-directory: terraform/benchmark
        env:
          INPUT_INSTANCE_TYPE: ${{ inputs.instance_type }}
          INPUT_AMI_ID: ${{ inputs.ami_id }}
          INPUT_ALLOW_UNPINNED: ${{ inputs.allow_unpinned_ami }}
        run: |
          set -euo pipefail
          extra_args=()
          if [ -n "${INPUT_INSTANCE_TYPE}" ]; then
            extra_args+=(-var "instance_type=${INPUT_INSTANCE_TYPE}")
          fi
          if [ -n "${INPUT_AMI_ID}" ]; then
            extra_args+=(-var "ami_id=${INPUT_AMI_ID}")
          fi
          if [ "${INPUT_ALLOW_UNPINNED}" = "true" ]; then
            extra_args+=(-var "allow_unpinned_ami=true")
          fi
          ok=false
          for attempt in 1 2 3; do
            if terraform destroy -auto-approve -input=false \
                 -var "pr_number=${PR_NUMBER}" \
                 "${extra_args[@]}"; then
              ok=true
              break
            fi
            echo "destroy attempt ${attempt} failed; sleeping 60s"
            sleep 60
          done
          if [ "$ok" != true ]; then
            echo "::error::terraform destroy failed after 3 attempts — bench-janitor will sweep ${BENCH_WORKSPACE} after 3h, but investigate NOW (metal host may still be billing)."
            exit 1
          fi

      - name: Delete bench workspace (always)
        if: always() && steps.workspace.outcome == 'success'
        working-directory: terraform/benchmark
        run: |
          set -euo pipefail
          terraform workspace select default
          if terraform workspace delete "${BENCH_WORKSPACE}"; then
            echo "Deleted workspace ${BENCH_WORKSPACE}"
          else
            echo "::warning::could not delete workspace ${BENCH_WORKSPACE} (non-empty state after failed destroy?) — bench-janitor sweeps it after 3h."
          fi

      - name: Verify no bench host is still running (always)
        if: always() && steps.workspace.outcome == 'success'
        run: |
          set -euo pipefail
          # Verify the real path, not the destroy exit code: list any
          # non-terminated instance still tagged with this bench workspace.
          leftovers=$(aws ec2 describe-instances \
            --filters "Name=tag:Workspace,Values=${BENCH_WORKSPACE}" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$leftovers" ]; then
            echo "::error::instances still not terminated for ${BENCH_WORKSPACE}: ${leftovers} — a metal host may still be billing."
            exit 1
          fi
          echo "No live instances remain for ${BENCH_WORKSPACE}."

      - name: Job summary
        if: always()
        run: |
          {
            echo "## US-008 benchmark pipeline (enabling work)"
            echo "- workspace: \`${BENCH_WORKSPACE:-unset}\`"
            echo "- lifecycle: job-scoped (provision → SSM run → destroy in this job)"
            echo "- runner output: schema skeleton with NOT_MEASURED sentinels only"
            echo "- **This run is NOT a benchmark, NOT a performance claim, and NOT evidence that US-008 passes.**"
          } >> "$GITHUB_STEP_SUMMARY"
