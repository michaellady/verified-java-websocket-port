\* TLC configuration for close-model.tla (staged as CloseModel.cfg next to
\* CloseModel.tla; see the STAGE AS note in the module header). The single
\* bound is deliberately chosen so the invariant it governs stays
\* falsifiable: TerminalBudget = 2 keeps the double-terminal-entry state
\* REPRESENTABLE, so TerminalEnteredAtMostOnce fails loudly under the
\* declared mutation instead of being true by typing. Deadlock detection
\* stays at the TLC default (enabled); the Quiescent action makes the
\* absorbing states stutter instead of deadlocking.
SPECIFICATION FairSpec
CONSTANT
    TerminalBudget = 2
INVARIANT TypeInvariant
INVARIANT TerminalEnteredAtMostOnce
INVARIANT ClosedIffOneTerminalEntry
INVARIANT CloseDetailPresentFromClosing
INVARIANT InboundCloseNormalization
INVARIANT EchoCarriesConstructorPayload
INVARIANT ForbiddenCodesNeverReachTheWire
INVARIANT TlsErrorSendAlwaysRejectedAs1002
INVARIANT NeverConnectedOnlyPreHandshake
INVARIANT RejectedSendDoesNotTransition
INVARIANT PoisonNeverFabricatesTermination
PROPERTY TerminalAbsorbing
PROPERTY PoisonAbsorbing
PROPERTY ClosingResolves
