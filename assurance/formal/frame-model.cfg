\* TLC configuration for frame-model.tla (staged as FrameModel.cfg next to
\* FrameModel.tla; see the STAGE AS note in the module header). Bounds are
\* deliberately small and finite, and each is chosen so the invariant it
\* governs stays falsifiable:
\*   MaxFrames = 2 gives at least one retire-then-restart cycle, so the
\*     budget-monotone property and the per-frame reset of the allocation
\*     accounting are both exercised.
\*   ControlPayloadLimit = 125 and FramePayloadCap = 65536 are the SHIPPED
\*     values (Java's fixed control limit; the port's default
\*     max_frame_payload_bytes), not scaled-down stand-ins, so the gate
\*     comparisons run against the real constants.
\*   ByteModulus = 2 with MaxPayloadOctets = 5 makes the mask track's
\*     payloads long enough to wrap the four-octet key index, which is what
\*     makes the key-alignment mutation detectable.
SPECIFICATION FairSpec
CONSTANT
    MaxFrames = 2
    ControlPayloadLimit = 125
    FramePayloadCap = 65536
    ByteModulus = 2
    MaxPayloadOctets = 5
INVARIANT TypeInvariant
INVARIANT TracksAreDisjoint
INVARIANT VerdictMatchesDeclaredTable
INVARIANT AllocationRespectsHeaderGate
INVARIANT OverCapRejectedAtLengthSite
INVARIANT UnknownOpcodeRejectedAtBaseHeader
INVARIANT ControlOverLimitRejectedAtBaseHeader
INVARIANT AcceptedControlFramesAreBounded
INVARIANT ConsumedSiteIsDeclared
INVARIANT MaskRoundTrip
PROPERTY FrameBudgetMonotone
PROPERTY FramesAlwaysResolve
